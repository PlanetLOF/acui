name: acui
description: "acui — the autocipher desktop app (Flutter)."
publish_to: 'none'

version: 1.0.2+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  autocipher_dart: ^0.1.0
  desktop_drop: ^0.8.4
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  file_selector: ^1.1.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  autocipher_dart:
    git:
      url: https://github.com/PlanetLOF/autocipher
      path: dart

flutter:
  uses-material-design: true

  # Branding assets only. The autocipher FFI engine is NOT a Flutter asset:
  # linux/CMakeLists.txt, windows/CMakeLists.txt and the macOS Xcode phase
  # install it into the bundle's lib/ (or Frameworks/), where autocipher_dart's
  # loader finds it by plain name. Run `just build-ffi` in the autocipher repo
  # first — CMake warns and ships without it otherwise.
  assets:
    - assets/pic_svg/
